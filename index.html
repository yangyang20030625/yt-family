<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Premium 家庭方案管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <!-- 標題與狀態列 -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="text-red-600">▶</span> YouTube Premium 家庭方案
                </h1>
                <p class="text-sm text-slate-500 mt-1">方案月費：$479 / 月｜每人分攤：$80 / 月</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                <span id="sync-status" class="text-xs px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 連線同步中...
                </span>
                <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-xl hover:bg-slate-800 transition shadow-sm">
                    管理員模式
                </button>
            </div>
        </header>

        <!-- 銀行轉帳資訊卡 (方便成員複製) -->
        <section class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="space-y-1">
                <div class="text-xs text-slate-400 font-medium flex items-center gap-1">
                    <span>💳</span> 匯款轉帳資訊（每人每期 $80）
                </div>
                <div class="text-lg font-bold tracking-wide" id="bank-info-text">
                    銀行代碼：013 ｜ 帳號：1234-5678-9012-3456
                </div>
                <div class="text-xs text-slate-400">請轉帳後通知管理員或於下方留言板告知</div>
            </div>
            <button onclick="copyBankInfo()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-xs font-medium rounded-xl transition border border-white/10 flex items-center gap-1.5 shrink-0">
                <span>📋</span> 一鍵複製帳號
            </button>
        </section>

        <!-- 管理員驗證面板 (預設隱藏) -->
        <div id="admin-auth-panel" class="hidden bg-red-50 border border-red-200 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-sm text-red-800 font-medium flex items-center gap-2">
                <span>🔒</span> 請輸入管理員密碼以解鎖編輯與刪除權限：
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="password" id="admin-password-input" placeholder="預設密碼: 0000" class="px-3 py-1.5 border border-red-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-500">
                <button onclick="verifyAdminPassword()" class="px-4 py-1.5 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition">確認解鎖</button>
            </div>
        </div>

        <!-- 成員列表容器 -->
        <main id="members-container" class="space-y-4">
            <!-- 動態載入成員卡片 -->
        </main>

        <!-- 小小留言板區塊 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span>💬</span> 小小留言板
            </h2>
            
            <!-- 發表留言表單 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">您的名字</label>
                        <input type="text" id="guest-name" placeholder="例如：單" class="w-full text-xs p-2 border border-slate-200 rounded-lg bg-white">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs text-slate-500 mb-1">想說的話 / 匯款通知</label>
                        <input type="text" id="guest-message" placeholder="例如：已轉帳 $80，請幫我對帳！" class="w-full text-xs p-2 border border-slate-200 rounded-lg bg-white">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button onclick="postMessage()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-lg transition">送出留言</button>
                </div>
            </div>

            <!-- 留言列表 -->
            <div id="messages-container" class="space-y-2">
                <div class="text-xs text-slate-400 italic py-2">載入留言中...</div>
            </div>
        </section>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==================== 您的 Firebase 設定 ====================
        const firebaseConfig = {
            apiKey: "AIzaSyAzVp...（請確認您原本的設定維持在此）",
            authDomain: "yt-family-billing.firebaseapp.com",
            projectId: "yt-family-billing",
            storageBucket: "yt-family-billing.appspot.com",
            messagingSenderId: "567891234",
            appId: "1:567891234:web:abcdef"
        };
        // ============================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_SECRET_CODE = "0625";
        let isAdminLoggedIn = false;

        const defaultMembers = [
            { id: "member_1", name: "單" },
            { id: "member_2", name: "李汪" },
            { id: "member_3", name: "資耘" },
            { id: "member_4", name: "黃建鈞" },
            { id: "member_5", name: "黃柏諺" }
        ];

        let membersData = {};
        let messagesData = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchCloudData();
            await fetchMessages();
        });

        // 一鍵複製銀行帳號
        window.copyBankInfo = function() {
            const textToCopy = "013 1234567890123456";
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("已成功複製銀行帳號資訊！");
            }).catch(err => {
                alert("複製失敗，請手動複製。");
            });
        }

        async function fetchCloudData() {
            const statusEl = document.getElementById('sync-status');
            try {
                const querySnapshot = await getDocs(collection(db, "youtube_family_v2"));
                if (querySnapshot.empty) {
                    for (let m of defaultMembers) {
                        membersData[m.id] = { name: m.name, history: [] };
                        await setDoc(doc(db, "youtube_family_v2", m.id), membersData[m.id]);
                    }
                } else {
                    querySnapshot.forEach((docSnap) => {
                        membersData[docSnap.id] = docSnap.data();
                    });
                }
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 雲端同步完成`;
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 font-medium flex items-center gap-1.5";
                renderUI();
            } catch (error) {
                console.error("連線錯誤:", error);
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> 雲端連線失敗`;
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-red-50 text-red-700 font-medium flex items-center gap-1.5";
            }
        }

        // 抓取留言板資料
        async function fetchMessages() {
            try {
                const querySnapshot = await getDocs(collection(db, "youtube_family_messages"));
                messagesData = [];
                querySnapshot.forEach((docSnap) => {
                    messagesData.push({ id: docSnap.id, ...docSnap.data() });
                });
                // 依時間排序（新留言在上面或下面皆可，這裡依時間舊到新排序）
                messagesData.sort((a, b) => new Date(a.time) - new Date(b.time));
                renderMessages();
            } catch (error) {
                console.error("載入留言失敗:", error);
            }
        }

        // 渲染留言板
        function renderMessages() {
            const container = document.getElementById('messages-container');
            if (messagesData.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 italic py-2">目前沒有留言，留個言打個招呼吧！</div>`;
                return;
            }

            container.innerHTML = '';
            messagesData.forEach((msg) => {
                const div = document.createElement('div');
                div.className = "flex items-start justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs gap-2";
                div.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800">${escapeHtml(msg.name)}</span>
                            <span class="text-slate-400 text-[10px]">${msg.time}</span>
                        </div>
                        <p class="text-slate-600 break-all">${escapeHtml(msg.message)}</p>
                    </div>
                    ${isAdminLoggedIn ? `<button onclick="deleteMessage('${msg.id}')" class="text-rose-600 hover:text-rose-800 font-medium px-2 py-1 bg-rose-50 rounded-lg hover:bg-rose-100 transition shrink-0">刪除</button>` : ''}
                `;
                container.appendChild(div);
            });
        }

        // 送出留言
        window.postMessage = async function() {
            const name = document.getElementById('guest-name').value.trim();
            const message = document.getElementById('guest-message').value.trim();

            if (!name || !message) {
                alert("請填寫名字與留言內容！");
                return;
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            try {
                await addDoc(collection(db, "youtube_family_messages"), {
                    name,
                    message,
                    time: timeStr
                });
                document.getElementById('guest-message').value = '';
                await fetchMessages();
                alert("留言成功送出！");
            } catch (error) {
                console.error("送出留言失敗:", error);
                alert("送出失敗，請檢查網路。");
            }
        }

        // 刪除留言 (管理員權限)
        window.deleteMessage = async function(msgId) {
            if (!confirm("確定要刪除這則留言嗎？")) return;
            try {
                await deleteDoc(doc(db, "youtube_family_messages", msgId));
                await fetchMessages();
            } catch (error) {
                console.error("刪除留言失敗:", error);
                alert("刪除失敗。");
            }
        }

        // 防止 XSS 簡易跳脫
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function renderUI() {
            const container = document.getElementById('members-container');
            container.innerHTML = '';

            const todayObj = new Date();
            todayObj.setHours(0, 0, 0, 0);
            const todayStr = todayObj.toISOString().split('T')[0];

            defaultMembers.forEach(m => {
                const data = membersData[m.id] || { name: m.name, history: [] };
                
                let currentStatusText = "尚無繳費紀錄";
                let badgeColor = "bg-slate-100 text-slate-600 border border-slate-200";
                let payDateStr = "未記錄";
                let startDateStr = "-";
                let expiryDateStr = "-";
                let nextSuggestedStartDate = todayStr;

                if (data.history && data.history.length > 0) {
                    const latest = data.history[data.history.length - 1];
                    payDateStr = latest.payDate || latest.startDate;
                    startDateStr = latest.startDate;
                    expiryDateStr = latest.expiryDate;
                    nextSuggestedStartDate = expiryDateStr;

                    const expiryObj = new Date(expiryDateStr);
                    expiryObj.setHours(0, 0, 0, 0);
                    
                    const diffTime = expiryObj - todayObj;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (expiryDateStr >= todayStr) {
                        if (diffDays <= 7 && diffDays >= 0) {
                            currentStatusText = `剩 ${diffDays} 天到期 (${expiryDateStr})`;
                            badgeColor = "bg-amber-50 text-amber-700 border border-amber-300 font-bold";
                        } else {
                            currentStatusText = `使用中 (至 ${expiryDateStr})`; badgeColor = "bg-emerald-50 text-emerald-700 border border-emerald-200"; } } else { currentStatusText = `已過期 (${expiryDateStr})`;
                        badgeColor = "bg-rose-50 text-rose-700 border border-rose-300 font-bold";
                    }
                }

                let historyHtml = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach((h, index) => {
                        const hPayDate = h.payDate || h.startDate;
                        historyHtml += `
                            <div class="flex items-center justify-between py-2 px-3 bg-slate-50 rounded-xl text-xs mb-1.5 border border-slate-100">
                                <div>
                                    <span class="font-semibold text-slate-700">繳費：${hPayDate}</span>
                                    <span class="text-slate-400 mx-1">|</span>
                                    <span class="text-slate-600">起算：${h.startDate} (${h.months}個月)</span>
                                    <span class="text-slate-400 mx-1">|</span>
                                    <span class="text-slate-500">到期：${h.expiryDate}</span>
                                    <div class="text-slate-400 mt-0.5">${h.note || '無備註'}</div>
                                </div>
                                ${isAdminLoggedIn ? `<button onclick="deleteHistoryItem('${m.id}', ${index})" class="text-rose-600 hover:text-rose-800 font-medium px-2 py-1 bg-rose-50 rounded-lg hover:bg-rose-100 transition">刪除此筆</button>` : ''}
                            </div>
                        `;
                    });
                } else {
                    historyHtml = `<div class="text-xs text-slate-400 italic py-1">目前沒有繳費紀錄</div>`;
                }

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-3";
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-700 text-lg">
                                ${m.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 text-base">${m.name}</h3>
                                <p class="text-xs text-slate-400">繳費日期：<span class="font-medium text-slate-600">${payDateStr}</span> ｜ 起算日期：<span class="font-medium text-slate-600">${startDateStr}</span></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-3 py-1.5 rounded-lg font-medium ${badgeColor}">
                                ${currentStatusText}
                            </span>
                            ${isAdminLoggedIn ? `<button onclick="toggleEditPanel('${m.id}')" class="px-3 py-1.5 bg-slate-900 text-white text-xs font-medium rounded-lg hover:bg-slate-800 transition">編輯/續費</button>` : ''}
                        </div>
                    </div>

                    <!-- 歷史紀錄與展開區塊 -->
                    <div class="border-t border-slate-100 pt-3 mt-1">
                        <p class="text-xs font-semibold text-slate-500 mb-2">繳費歷史紀錄：</p>
                        <div class="space-y-1">
                            ${historyHtml}
                        </div>
                    </div>

                    <!-- 管理員編輯表單 (預設隱藏) -->
                    <div id="edit-panel-${m.id}" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 mt-3 space-y-3">
                        <h4 class="text-xs font-bold text-slate-700">新增繳費紀錄 / 修正資料</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">繳費日期 (實際付錢日)</label>
                                <input type="date" id="pay-date-${m.id}" class="w-full text-xs p-2 border border-slate-200 rounded-lg bg-white" value="${todayStr}">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">起算日期 (方案生效日)</label>
